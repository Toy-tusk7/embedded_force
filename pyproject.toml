[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embedforge"
version = "0.1.0"
description = "Autonomous AI-Assisted Embedded Engineering System powered by NVIDIA Nemotron and Nebius Token Factory"
readme = "README.md"
authors = [{ name = "EmbedForge Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "requests>=2.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
embedforge = "embedforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
