[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embedforge"
version = "0.1.0"
description = "Autonomous AI-Assisted Embedded Engineering System powered by NVIDIA Nemotron and Nebius Token Factory"
readme = "README.md"
authors = [{ name = "EmbedForge Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "platformio>=6.1",
    "anthropic>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
# Datasheet PDF -> Markdown (headings, tables, reconstructed equations). PyMuPDF is AGPL-3.0 (or commercial licence);
# without it PDFs are read with pypdf (plain text). It also renders datasheet figures for the vision model (read_figure).
pdf = [
    "pymupdf4llm>=1.28",
]
# LangSmith run tracing (LANGCHAIN_TRACING_V2=true)
tracing = [
    "langsmith>=0.1",
]

[project.scripts]
embedforge = "embedforge.server:main"

[tool.setuptools.package-data]
# the IDE, the agent's skills (playbooks) and the benchmark's datasheet ship with the package
embedforge = ["web/*", "skills/*.md", "verifybench/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
